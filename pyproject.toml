[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osrs-ee"
version = "0.1.0"
description = "OSRS_ee — Consolidated Reliability, Isolation & Execution Core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
osrs-ee = "osrs_ee.cli:main"

[tool.setuptools.packages.find]
include = ["osrs_ee*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
